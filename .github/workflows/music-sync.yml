name: Daily Music Sync

on:
  schedule:
    - cron: '30 1 * * *'   # 每天 UTC 01:30（北京时间 09:30）自动同步
  workflow_dispatch:       # 也支持手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily music sync
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # 下载同步脚本
          curl -fsSL "https://raw.githubusercontent.com/y249376764/navpage-2026/main/lx_daily_sync.py" -o lx_daily_sync.py
          python3 lx_daily_sync.py
